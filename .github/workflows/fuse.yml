# Drop this into any data repo to get blast-radius analysis on every PR.
name: fuse

on:
  pull_request:
    paths:
      - "models/**/*.sql"
      - "dags/**/*.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Not published to PyPI yet, so install from the repository.
      - run: pip install "fuse-datahub[openrouter] @ git+https://github.com/BriceZemba/fuse-datahub@main"

      - name: Analyse the change
        id: fuse
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
          TOOLS_IS_MUTATION_ENABLED: "true"
          # Any provider works; openrouter needs no paid account. Leave unset to run
          # with deterministic templates and no model at all.
          FUSE_LLM_PROVIDER: openrouter
          FUSE_LLM_MODEL: ${{ vars.FUSE_LLM_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.patch
          fuse check --repo . --diff /tmp/pr.patch --auto-approve --fail-on BREAKING
        continue-on-error: true

      - name: Comment the impact report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            if (!fs.existsSync('out')) {
              core.info('No output produced; nothing to comment.');
              return;
            }
            // A run writes one directory named after its id; pick the newest rather
            // than whatever readdir happens to return first.
            const runs = fs.readdirSync('out')
              .map(name => ({ name, time: fs.statSync(path.join('out', name)).mtimeMs }))
              .sort((a, b) => b.time - a.time);
            const body = fs.readFileSync(path.join('out', runs[0].name, 'PR_BODY.md'), 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on breaking changes
        if: steps.fuse.outcome == 'failure'
        run: exit 1
