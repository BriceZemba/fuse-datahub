# Drop this into any data repo to get blast-radius analysis on every PR.
name: fuse

on:
  pull_request:
    paths:
      - "models/**/*.sql"
      - "dags/**/*.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fuse-datahub

      - name: Analyse the change
        id: fuse
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
          TOOLS_IS_MUTATION_ENABLED: "true"
          FUSE_LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.patch
          fuse check --repo . --diff /tmp/pr.patch --auto-approve --fail-on BREAKING
        continue-on-error: true

      - name: Comment the impact report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = fs.readdirSync('out');
            const body = fs.readFileSync(`out/${glob[0]}/PR_BODY.md`, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on breaking changes
        if: steps.fuse.outcome == 'failure'
        run: exit 1
