[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuse-datahub"
version = "0.1.0"
description = "The blast-radius agent for DataHub: turns a schema diff into an impact verdict, remediation code, and a PR."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The Fuse Authors" }]
keywords = ["datahub", "langgraph", "mcp", "data-lineage", "ai-agent", "dbt"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-mcp-adapters>=0.1.0",
  "acryl-datahub>=1.0.0",
  "sqlglot>=25.0.0",
  "jinja2>=3.1.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2.0"]
openai = ["langchain-openai>=0.2.0"]
ollama = ["langchain-ollama>=0.2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.0"]

[project.scripts]
fuse = "fuse.cli:app"

[project.urls]
Homepage = "https://github.com/BriceZemba/fuse-datahub"
Repository = "https://github.com/BriceZemba/fuse-datahub"

[tool.hatch.build.targets.wheel]
packages = ["src/fuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly: ruff's default rule set changes between releases, and CI that
# lints against a moving target fails for reasons unrelated to the change under review.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is function calls in argument defaults; that is the documented usage.
"src/fuse/cli.py" = ["B008"]
# The DataHub SDK emits an ExperimentalWarning at import time; the filter has to be
# installed before the import, which is exactly what E402 forbids.
"demo/seed_ml_lineage.py" = ["E402"]
